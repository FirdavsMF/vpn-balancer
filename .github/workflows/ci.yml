name: CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Проверка кода
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod download

    - name: Run go vet
      run: go vet ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: latest
        args: --timeout=5m

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  # Сборка
  build:
    name: Build
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
        arch: [amd64, arm64]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build
      run: |
        GOOS=linux GOARCH=${{ matrix.arch }} go build \
          -ldflags "-X main.Version=${GITHUB_REF##*/} -X main.BuildTime=$(date -u '+%Y-%m-%d_%H:%M:%S') -X main.GitCommit=${GITHUB_SHA}" \
          -o vpn-balancer-${{ matrix.arch }} \
          ./cmd/vpn-balancer

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: vpn-balancer-linux-${{ matrix.arch }}
        path: vpn-balancer-${{ matrix.arch }}

  # Релиз при тегах
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build all platforms
      run: |
        GOOS=linux GOARCH=amd64 go build -o vpn-balancer-linux-amd64 ./cmd/vpn-balancer
        GOOS=linux GOARCH=arm64 go build -o vpn-balancer-linux-arm64 ./cmd/vpn-balancer
        GOOS=android GOARCH=arm64 go build -o vpn-balancer-android-arm64 ./cmd/vpn-balancer

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          vpn-balancer-linux-amd64
          vpn-balancer-linux-arm64
          vpn-balancer-android-arm64
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
