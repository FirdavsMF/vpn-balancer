name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install dependencies
      run: go mod download

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      run: go test -v -race ./...

    - name: Build
      run: go build -o vpn-balancer ./cmd/vpn-balancer

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: vpn-balancer
        path: vpn-balancer

  release:
    name: Create Release
    needs: test-and-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build all platforms
      run: |
        GOOS=linux GOARCH=amd64 go build -o vpn-balancer-linux-amd64 ./cmd/vpn-balancer
        GOOS=linux GOARCH=arm64 go build -o vpn-balancer-linux-arm64 ./cmd/vpn-balancer

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          vpn-balancer-linux-amd64
          vpn-balancer-linux-arm64
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
